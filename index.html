<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisor QC · ESENCIA</title>
<style>
:root{
  --bg:#0d1117; --bg2:#131a23; --bg3:#1b2430; --linea:#26303d;
  --txt:#e6edf3; --txt2:#8b98a8; --txt3:#5d6b7d;
  --azul:#14a9ff; --ok:#2ea043; --amb:#ffaf14; --rojo:#f5384e; --rosa:#f3a6b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:7px;background:var(--bg3);color:var(--txt);padding:7px 12px;transition:.12s}
button:hover{background:#27323f}
button:active{transform:translateY(1px)}
button.pri{background:var(--azul);color:#04121d;font-weight:600}
button.pri:hover{background:#3fbaff}
button.ok{background:var(--ok);color:#04120a;font-weight:600}
button.peq{padding:4px 8px;font-size:12px;border-radius:6px}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;background:var(--bg);border:1px solid var(--linea);color:var(--txt);border-radius:7px;padding:7px 9px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--azul)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--linea);flex-shrink:0}
header h1{font-size:14px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
header h1 span{color:var(--azul)}
header .sep{flex:1}
header input.proy{width:190px;padding:5px 8px;font-size:13px}
#rescate{display:none;align-items:center;gap:9px;padding:9px 14px;background:#1d2a1f;border-bottom:1px solid #2c4430;color:#a6e0b4;font-size:13px;flex-shrink:0}
#rescate.act{display:flex}
#guardado{font-size:11px;color:var(--txt3);white-space:nowrap}
#main{flex:1;display:grid;grid-template-columns:50% 50%;min-height:0}
#izq{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--linea);background:#07090c}
#der{display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* ---------- video ---------- */
#zonaVideo{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;background:#000}
#video{max-width:100%;max-height:100%;display:block;background:#000}
#sinVideo{color:var(--txt3);text-align:center;padding:30px;font-size:13px;line-height:1.8}
#subOverlay{position:absolute;left:0;right:0;bottom:8%;text-align:center;pointer-events:none;padding:0 6%}
#subOverlay span{background:rgba(0,0,0,.62);padding:4px 10px;border-radius:6px;font-size:15px;line-height:1.55;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#transporte{background:var(--bg2);border-top:1px solid var(--linea);padding:8px 12px 10px;flex-shrink:0}
.fila{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fila+.fila{margin-top:7px}
#barra{position:relative;height:26px;background:var(--bg);border:1px solid var(--linea);border-radius:6px;overflow:hidden;cursor:pointer;margin:8px 0 6px}
#barraProg{position:absolute;top:0;bottom:0;left:0;background:rgba(20,169,255,.18);pointer-events:none}
#barraCursor{position:absolute;top:0;bottom:0;width:2px;background:var(--azul);pointer-events:none}
.marcaSub{position:absolute;top:16px;height:8px;background:var(--txt3);border-radius:2px;pointer-events:none}
.marcaErr{position:absolute;top:2px;width:3px;height:12px;border-radius:2px;pointer-events:none}
#tcGrande{font-size:19px;font-weight:700;letter-spacing:.5px}
#tcSec{color:var(--txt2);font-size:12px}
.pill{background:var(--bg3);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--txt2);white-space:nowrap}

/* ---------- cinta de segundos ---------- */
#cinta{display:flex;flex-wrap:wrap;gap:2px;max-height:56px;overflow-y:auto;padding:2px 0}
.seg{width:20px;height:15px;border-radius:3px;background:#1e2732;font-size:9px;color:var(--txt3);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.seg:hover{outline:1px solid var(--azul)}
.seg.ok{background:#16341f;color:#5fce80}
.seg.err{background:#3a1116;color:#ff8b98}
.seg.act{outline:2px solid var(--azul);color:var(--txt)}

/* ---------- panel derecho ---------- */
#tabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--bg2);border-bottom:1px solid var(--linea);flex-shrink:0}
.tab{padding:7px 13px;border-radius:7px 7px 0 0;background:transparent;color:var(--txt2);font-size:13px}
.tab.act{background:var(--bg);color:var(--txt);font-weight:600;box-shadow:inset 0 -2px 0 var(--azul)}
.tab b{color:var(--azul);margin-left:5px}
#panel{flex:1;overflow-y:auto;padding:12px 14px 60px}
.vista{display:none}
.vista.act{display:block}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--txt2);margin:16px 0 8px;font-weight:700}
h2:first-child{margin-top:0}
.caja{background:var(--bg2);border:1px solid var(--linea);border-radius:9px;padding:11px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{display:block;font-size:11px;color:var(--txt2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}

/* clips */
.clip{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;background:var(--bg2);border:1px solid var(--linea);margin-bottom:7px;cursor:pointer}
.clip:hover{border-color:#3a4a5e}
.clip.act{border-color:var(--azul);background:#0f2233}
.clip .num{width:26px;height:26px;border-radius:7px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.clip .nom{flex:1;min-width:0}
.clip .nom div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .nom div:last-child{font-size:11px;color:var(--txt2)}
.clip .est{font-size:11px;text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px}
.b-err{background:#3a1116;color:#ff8b98}
.b-ok{background:#16341f;color:#5fce80}
.b-pend{background:var(--bg3);color:var(--txt2)}

/* subtitulos */
.sub{padding:8px 10px;border-radius:8px;margin-bottom:5px;background:var(--bg2);border:1px solid transparent;cursor:pointer}
.sub:hover{border-color:#33414f}
.sub.act{background:#0f2233;border-color:var(--azul)}
.sub .tc{font-size:11px;color:var(--txt2);display:flex;gap:8px;align-items:center;margin-bottom:3px}
.sub .txt{line-height:1.55}
.pal{cursor:pointer;border-radius:4px;padding:0 1px}
.pal:hover{background:var(--azul);color:#04121d}
.pal.marcada{color:var(--azul);font-weight:600}
.pal.fuera,.fuera{text-decoration:underline wavy #f5384e;text-underline-offset:3px}
.pal.hl{font-weight:600}
.sub.conAviso{border-color:#5c4a1b}
.sub .aviso{color:var(--amb);font-size:11px;margin-top:5px}
.sub .tc .sep{flex:1}
button.cal{opacity:.35;font-size:10px;padding:2px 6px}
.sub:hover button.cal,.sub.act button.cal{opacity:1}

/* errores */
.err{background:var(--bg2);border:1px solid var(--linea);border-left:3px solid var(--rojo);border-radius:9px;padding:10px;margin-bottom:9px;display:flex;gap:10px}
.err.sev-medio{border-left-color:var(--amb)}
.err.sev-menor{border-left-color:var(--txt3)}
.err img{width:auto;max-width:86px;max-height:124px;border-radius:6px;cursor:zoom-in;background:#000;flex-shrink:0;align-self:flex-start}
.err .cuerpo{flex:1;min-width:0}
.err .cab{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.err .desc{color:var(--txt);font-size:13px;line-height:1.5;white-space:pre-wrap}
.err .cita{color:var(--txt2);font-size:12px;font-style:italic;margin-top:4px}
.err .acc{display:flex;gap:6px;margin-top:7px}
.tipoTag{background:var(--bg3);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}

/* modal */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#velo.act{display:flex}
#modal{background:var(--bg2);border:1px solid var(--linea);border-radius:14px;padding:18px;width:min(860px,96vw);max-height:92vh;overflow-y:auto}
#modal h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:9px}
#modalCap{width:100%;max-height:300px;object-fit:contain;background:#000;border-radius:9px;margin-bottom:10px}
#lupa{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;padding:20px}
#lupa.act{display:flex}
#lupa img{max-width:100%;max-height:100%;border-radius:8px}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--linea);padding:9px 16px;border-radius:9px;z-index:70;opacity:0;transition:.25s;pointer-events:none;font-size:13px}
#toast.act{opacity:1}
.ayuda{color:var(--txt3);font-size:11px;line-height:1.7}
kbd{background:var(--bg3);border:1px solid var(--linea);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:11px;color:var(--txt)}
.vacio{color:var(--txt3);text-align:center;padding:26px 10px;font-size:13px;line-height:1.7}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3644;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>REVISOR <span>QC</span></h1>
    <input class="proy" id="fProyecto" placeholder="Proyecto" value="">
    <input class="proy" id="fCliente" placeholder="Cliente">
    <input class="proy" id="fRevisor" placeholder="Revisor" style="width:130px">
    <span class="sep"></span>
    <span class="pill" id="pillEstado">sin archivos</span>
    <span id="guardado"></span>
    <button class="peq" id="bAyuda">Atajos</button>
    <button class="peq" id="bCargar">Cargar archivos</button>
    <button class="peq" id="bGuardar">Guardar avance</button>
    <button class="peq" id="bAbrir">Abrir avance</button>
    <button class="pri peq" id="bInforme">Generar informe</button>
    <input type="file" id="inArchivos" multiple accept="video/*,.srt,.txt,.vtt,.json,.docx" hidden>
    <input type="file" id="inAvance" accept=".json" hidden>
  </header>

  <div id="rescate">
    <span id="rescateTxt"></span>
    <span class="sep" style="flex:1"></span>
    <button class="pri peq" id="bRescatar">Recuperar</button>
    <button class="peq" id="bDescartar">Descartar</button>
  </div>

  <div id="main">
    <div id="izq">
      <div id="zonaVideo">
        <video id="video" playsinline hidden></video>
        <div id="sinVideo">
          Arrastra aquí los <b>clips</b> (.mp4), el <b>.srt</b> del proyecto<br>y el <b>.docx</b> de clips aprobados<br>
          o pulsa <b>Cargar archivos</b> arriba a la derecha.
        </div>
        <div id="subOverlay"></div>
      </div>
      <div id="transporte">
        <div id="barra">
          <div id="barraProg"></div>
          <div id="barraCursor" style="left:0"></div>
        </div>
        <div class="fila">
          <button id="bPlay" style="width:44px">▶</button>
          <button class="peq" id="bAtras">◀ paso</button>
          <button class="peq" id="bAdelante">paso ▶</button>
          <span class="mono" id="tcGrande">00:00:00:00</span>
          <span class="mono" id="tcSec">0.000 s · sec 0.000 s</span>
          <span class="sep" style="flex:1"></span>
          <select id="fPaso" style="width:104px" title="Tamaño del paso">
            <option value="frame">1 frame</option>
            <option value="0.25">0.25 s</option>
            <option value="0.5">0.5 s</option>
            <option value="1" selected>1 s</option>
            <option value="2">2 s</option>
          </select>
          <select id="fVel" style="width:78px" title="Velocidad">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </div>
        <div class="fila" style="margin-top:8px">
          <button class="pri peq" id="bError">+ Error aquí <kbd>E</kbd></button>
          <button class="ok peq" id="bSegOk">Segundo OK <kbd>G</kbd></button>
          <button class="peq" id="bCaptura">Captura suelta</button>
          <span class="sep" style="flex:1"></span>
          <span class="pill" id="pillCinta">—</span>
        </div>
        <div id="cinta"></div>
      </div>
    </div>

    <div id="der">
      <div id="tabs">
        <button class="tab act" data-v="clips">Clips<b id="nClips">0</b></button>
        <button class="tab" data-v="subs">Subtítulos<b id="nSubs">0</b></button>
        <button class="tab" data-v="guion">Guion</button>
        <button class="tab" data-v="errores">Errores<b id="nErrs">0</b></button>
        <button class="tab" data-v="ajustes">Ajustes</button>
      </div>
      <div id="panel">
        <div class="vista act" id="v-clips"></div>
        <div class="vista" id="v-subs"></div>
        <div class="vista" id="v-guion"></div>
        <div class="vista" id="v-errores"></div>
        <div class="vista" id="v-ajustes"></div>
      </div>
    </div>
  </div>
</div>

<div id="velo"><div id="modal"></div></div>
<div id="lupa"><img id="lupaImg" alt=""></div>
<div id="toast"></div>
<canvas id="lienzo" hidden></canvas>

<script>
/* ============================================================
   REVISOR QC · ESENCIA — Juan Pablo Edit
   Un solo archivo, sin dependencias, sin servidor.
   Nada sale del computador: los videos se leen con URL.createObjectURL.
   ============================================================ */

const TIPOS = [
  {id:'texto_mas',   n:'Texto de más',        c:'#f5384e', ayuda:'Palabra o frase escrita que no se dice'},
  {id:'texto_falta', n:'Palabra faltante',    c:'#ff7043', ayuda:'Se dice pero no está en el subtítulo'},
  {id:'inaudible',   n:'Inaudible',           c:'#ffaf14', ayuda:'No se entiende / audio sucio'},
  {id:'sin_resalte', n:'Sin resaltar',        c:'#14a9ff', ayuda:'La palabra clave quedó en blanco'},
  {id:'mal_resalte', n:'Resalte incorrecto',  c:'#4fc3f7', ayuda:'Resaltó una palabra que no era'},
  {id:'encuadre',    n:'Encuadre',            c:'#ab47bc', ayuda:'Cabeza cortada, aire, descentrado'},
  {id:'plano',       n:'Plano / corte',       c:'#7e57c2', ayuda:'Plano repetido, salto, corte mal puesto'},
  {id:'color',       n:'Colorimetría',        c:'#26a69a', ayuda:'Color distinto entre planos, expuesto mal'},
  {id:'sync',        n:'Sync de subtítulo',   c:'#66bb6a', ayuda:'Entra tarde o temprano'},
  {id:'audio',       n:'Audio',               c:'#8d6e63', ayuda:'Nivel, pop, ruido, música'},
  {id:'otro',        n:'Otro',                c:'#78909c', ayuda:''}
];
const SEVS = [{id:'critico',n:'Crítico'},{id:'medio',n:'Medio'},{id:'menor',n:'Menor'}];
const tipoDe = id => TIPOS.find(t=>t.id===id) || TIPOS[TIPOS.length-1];

const S = {
  proyecto:'', cliente:'', revisor:'',
  fps:30,
  modoReparto:'acumulado',   // acumulado | huecos | reinicio | manual
  umbralHueco:1.5,
  clips:[],                  // {id,nombre,archivo,url,dur,inicio,subs:[],errores:[],segsOk:[],revisado:false}
  srtNombre:'', cues:[],     // cues del srt tal cual viene
  doc:[], docNombre:'', bloques:0, rangos:{}, colorResalte:'#14a9ff', umbralGuion:0.45,
  actual:-1,
  contador:1
};

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const video = $('#video');

/* ---------- utilidades ---------- */
function pad(n,l=2){ return String(Math.floor(Math.abs(n))).padStart(l,'0'); }
function aTC(seg, fps){                      // HH:MM:SS:FF
  fps = fps || S.fps; if(!isFinite(seg)) seg=0; if(seg<0) seg=0;
  const f = Math.floor((seg - Math.floor(seg)) * fps + 1e-6);
  const s = Math.floor(seg);
  return `${pad(s/3600)}:${pad((s%3600)/60)}:${pad(s%60)}:${pad(f)}`;
}
function aMS(seg){                            // m:ss.mmm
  if(!isFinite(seg)||seg<0) seg=0;
  const ms = Math.round(seg*1000);
  return `${Math.floor(ms/60000)}:${pad((ms%60000)/1000)}.${pad(ms%1000,3)}`;
}
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('act'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('act'),2100); }
function natSort(a,b){ return a.localeCompare(b,'es',{numeric:true,sensitivity:'base'}); }
const RX_DIAC = new RegExp('[\\u0300-\\u036f]','g');
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(RX_DIAC,''); }

/* ---------- SRT / VTT ---------- */
function tcASeg(t){
  const m = t.trim().match(/(?:(\d+):)?(\d{1,2}):(\d{1,2})[,.](\d{1,3})/);
  if(!m) return null;
  return (+(m[1]||0))*3600 + (+m[2])*60 + (+m[3]) + (+m[4].padEnd(3,'0'))/1000;
}
/* Parte el texto de un cue en tramos {t, hl} para conservar el resalte que
   Premiere exporta como <font color="#009df9">palabra</font>. */
function trocearResalte(bruto){
  const partes = [];
  const rx = /<(font|b|u)\b[^>]*>([\s\S]*?)<\/\1>/gi;
  let pos = 0, m;
  while((m = rx.exec(bruto)) !== null){
    if(m.index > pos) partes.push({t: limpiarTxt(bruto.slice(pos, m.index)), hl:false});
    const col = (m[0].match(/color\s*=\s*"?(#[0-9a-fA-F]{3,8})"?/)||[])[1];
    if(col) S.colorResalte = col;
    partes.push({t: limpiarTxt(m[2]), hl:true});
    pos = m.index + m[0].length;
  }
  if(pos < bruto.length) partes.push({t: limpiarTxt(bruto.slice(pos)), hl:false});
  return partes.filter(x=>x.t !== '');
}
function limpiarTxt(t){ return t.replace(/<[^>]+>/g,''); }
/* palabras resaltadas de un subtítulo */
function resaltesDe(s){
  return (s.partes||[]).filter(x=>x.hl).map(x=>x.t.trim()).filter(Boolean);
}

function parseSubs(txt){
  txt = txt.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const cues=[];
  const bloques = txt.split(/\n{2,}/);
  for(const b of bloques){
    const ls = b.split('\n').filter(l=>l.trim()!=='');
    if(!ls.length) continue;
    let i = 0, idx = 0;
    if(/^\d+$/.test(ls[0].trim())){ idx = +ls[0].trim(); i = 1; }
    if(i>=ls.length) continue;
    const mt = ls[i].match(/(.+?)\s*-->\s*(.+)/);
    if(!mt) continue;
    const ini = tcASeg(mt[1]), fin = tcASeg(mt[2]);
    if(ini==null||fin==null) continue;
    const bruto = ls.slice(i+1).join('\n').replace(/\{[^}]*\}/g,'');
    const partes = trocearResalte(bruto);
    const texto = partes.map(x=>x.t).join('').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').trim();
    if(texto) cues.push({ini,fin,texto,partes,idx});
  }
  return cues;   // orden del archivo: con 10 SRT pegados, reordenar por tiempo los mezclaría
}

/* ---------- tiempo de un subtítulo ya con el sync del clip aplicado ---------- */
const sIni = (c,s)=> s.ini + (c.sync||0);
const sFin = (c,s)=> s.fin + (c.sync||0);

/* ---------- reparto del SRT entre los clips ---------- */
function detectarModo(){
  if(!S.cues.length || !S.clips.length) return S.modoReparto;
  if(S.doc.length) return 'guion';           // con documento, siempre alinear por contenido
  if(bloquesSRT(S.cues).length > 1) return 'bloques';
  const finSrt = S.cues[S.cues.length-1].fin;
  if(S.clips.length>1 && finSrt <= Math.max(...S.clips.map(c=>c.dur))+1) return 'reinicio';
  return 'acumulado';
}

/* ============================================================
   ALINEAR CON EL GUION — el modo bueno cuando hay .docx.
   Puntúa cada línea del .srt contra el guion de cada clip del documento
   (pesando las palabras raras con IDF), suaviza el resultado en una ventana
   de ±4 líneas y corta donde cambia el clip. Funciona igual si el .srt es
   la secuencia entera, la entrevista o los .srt de cada clip pegados.
   ============================================================ */
function alinearConGuion(){
  const D = S.doc, n = S.cues.length;
  S.clips.forEach(c=>{ c.subs=[]; c.bloque=-1; c.coinc=0; });
  if(!D.length || !n) return false;

  const W = 4, MINCUES = 8, CORTE = 8.0;

  // bolsas de palabras de cada guion + IDF (las palabras raras mandan)
  const bolsas = D.map(d=> new Set(bolsa(textoDoc(d))));
  const df = {};
  bolsas.forEach(b=> b.forEach(w=>{ df[w] = (df[w]||0) + 1; }));
  const N = bolsas.length;
  const idf = w => Math.log((N + 1) / ((df[w]||0) + 0.5));

  // 1. puntuar cada línea del .srt contra cada guion
  const bruto = new Array(n);
  for(let i = 0; i < n; i++){
    const ws = bolsa(S.cues[i].texto);
    const fila = new Float32Array(N);
    let tot = 0; for(const w of ws) tot += idf(w);
    if(tot > 0) for(let j = 0; j < N; j++){
      let acc = 0;
      for(const w of ws) if(bolsas[j].has(w)) acc += idf(w);
      fila[j] = acc / tot;
    }
    bruto[i] = fila;
  }
  // 2. suavizar en ventana de ±W líneas y quedarse con el mejor clip
  const asig = new Array(n).fill(-1), fuerza = new Array(n).fill(0);
  const acum = new Float32Array(N);
  for(let i = 0; i < n; i++){
    const a = Math.max(0, i-W), z = Math.min(n, i+W+1);
    acum.fill(0);
    for(let k = a; k < z; k++){ const f = bruto[k]; for(let j = 0; j < N; j++) acum[j] += f[j]; }
    let mejor = -1, ms = 0;
    for(let j = 0; j < N; j++){ const v = acum[j]/(z-a); if(v > ms){ ms = v; mejor = j; } }
    if(ms >= S.umbralGuion){ asig[i] = mejor; fuerza[i] = ms; }
  }
  // 3. rellenar huecos cortos entre dos tramos del mismo clip
  for(let i = 0; i < n; i++){
    if(asig[i] >= 0) continue;
    let a = i-1; while(a >= 0 && asig[a] < 0) a--;
    let b = i+1; while(b < n && asig[b] < 0) b++;
    if(a >= 0 && b < n && asig[a] === asig[b]) asig[i] = asig[a];
  }
  // 4. rachas contiguas; de cada clip nos quedamos con la más larga
  const rachas = [];
  let cur = asig[0], desde = 0;
  for(let i = 1; i <= n; i++){
    const a = (i < n) ? asig[i] : -99;
    if(a !== cur){
      if(cur >= 0) rachas.push({j:cur, a:desde, b:i-1});
      cur = a; desde = i;
    }
  }
  const mejorDe = {};
  rachas.forEach(r=>{
    r.nc = r.b - r.a + 1;
    let sc = 0; for(let k = r.a; k <= r.b; k++) sc += fuerza[k];
    r.sc = sc / r.nc;
    if(r.nc < MINCUES) return;
    if(!mejorDe[r.j] || r.nc > mejorDe[r.j].nc) mejorDe[r.j] = r;
  });
  // 5. si dentro de una racha hay un silencio largo, quedarse con el trozo mayor
  Object.keys(mejorDe).forEach(k=>{
    const r = mejorDe[k];
    const trozos = []; let t = [r.a];
    for(let i = r.a + 1; i <= r.b; i++){
      if(S.cues[i].ini - S.cues[i-1].fin > CORTE){ trozos.push(t); t = []; }
      t.push(i);
    }
    trozos.push(t);
    let big = trozos[0];
    trozos.forEach(x=>{ if(x.length > big.length) big = x; });
    r.a = big[0]; r.b = big[big.length-1]; r.nc = big.length;
  });
  // 6. si dos clips se pisan, gana el que puntúa más alto
  const lista = Object.keys(mejorDe).map(k=>mejorDe[k]).sort((x,y)=>x.a-y.a);
  for(let k = 1; k < lista.length; k++){
    const p = lista[k-1], q = lista[k];
    if(q.a <= p.b){ if(p.sc >= q.sc) q.a = p.b + 1; else p.b = q.a - 1; }
  }
  S.rangos = {};
  lista.forEach(r=>{ if(r.b - r.a + 1 >= MINCUES) S.rangos[r.j] = {a:r.a, b:r.b, sc:r.sc, nc:r.nc}; });
  aplicarRangos();
  return true;
}

/* ============================================================
   CRUZAR CADA VIDEO CON SU CLIP DEL DOCUMENTO
   1) por el nombre del archivo (C) Título)
   2) si no casa: por la duración del tramo que el .srt le asigna a ese clip
   3) si aún queda ambigüedad: por orden, avisando en amarillo
   Lo que cambies a mano manda siempre.
   ============================================================ */
function cruzarClips(){
  const D = S.doc;
  if(!D.length){ S.clips.forEach(c=>{ c.doc=null; c.docSim=0; c.comoCruzo=''; }); return; }
  const usados = new Set();
  S.clips.forEach(c=>{
    if(c.docManual && c.doc && D.indexOf(c.doc)>=0){ usados.add(D.indexOf(c.doc)); c.comoCruzo='manual'; }
    else { c.doc = null; c.docSim = 0; c.comoCruzo = ''; }
  });

  // 1) por nombre de archivo
  const cand = [];
  S.clips.filter(c=>!c.doc).forEach(c=>{
    const nn = normNombre(c.nombre);
    D.forEach((d,k)=>{
      if(usados.has(k)) return;
      const dn = normNombre(d.archivo || d.titulo);
      const sc = (dn === nn) ? 1 : dice(bolsa(dn), bolsa(nn));
      if(sc >= 0.5) cand.push([c, k, sc]);
    });
  });
  cand.sort((a,b)=>b[2]-a[2]);
  cand.forEach(x=>{
    if(x[0].doc || usados.has(x[1])) return;
    x[0].doc = D[x[1]]; x[0].docSim = x[2]; x[0].comoCruzo = 'nombre'; usados.add(x[1]);
  });

  // 2) los que no casaron por nombre: por duración + orden.
  //    Los clips salen de la secuencia en orden y los archivos vienen numerados igual,
  //    así que emparejamos de forma monótona: nunca cruza dos por delante.
  const R = S.rangos || {};
  const vidsLibres = S.clips.filter(c=>!c.doc);                       // ya en orden natural
  const rangLibres = Object.keys(R).map(Number).filter(k=>!usados.has(k))
                       .sort((x,y)=>R[x].a - R[y].a);                  // en orden del .srt
  if(vidsLibres.length && rangLibres.length){
    const durT = k=>{ const r = R[k]; return S.cues[r.b].fin - S.cues[r.a].ini; };
    const sim = (c,k)=>{
      const dv = c.dur || 0, dt = durT(k);
      if(!dv || !dt) return 0.5;                                       // sin duración: sólo cuenta el orden
      return 1 - Math.abs(dv - dt) / Math.max(dv, dt);
    };
    emparejarMonotono(vidsLibres, rangLibres, sim, 0.45).forEach(par=>{
      const c = vidsLibres[par[0]], k = rangLibres[par[1]];
      if(c.doc || usados.has(k)) return;
      c.doc = D[k]; c.docSim = par[2];
      c.comoCruzo = par[2] >= 0.85 ? 'duración' : 'orden';
      usados.add(k);
    });
  }
}

/* aplica los tramos ya calculados (rápido: no recalcula la alineación) */
function aplicarRangos(){
  const D = S.doc, R = S.rangos || {};
  S.clips.forEach(c=>{ c.subs=[]; c.bloque=-1; c.coinc=0; c._bolsa=null; });
  cruzarClips();
  S.bloques = Object.keys(R).length;
  S.clips.forEach(c=>{
    if(!c.doc) return;
    const r = R[D.indexOf(c.doc)];
    if(!r) return;
    const trozo = S.cues.slice(r.a, r.b + 1);
    if(!trozo.length) return;
    const base = trozo[0].ini > 5 ? trozo[0].ini : 0;
    c.inicio = base;
    c.bloque = r.a;
    c.coinc  = r.sc;
    c.subs = trozo.map(q=>({ini:+(q.ini-base).toFixed(3), fin:+(q.fin-base).toFixed(3),
                            texto:q.texto, partes:q.partes, marcadas:[]}));
  });
}

/* Un bloque de SRT por clip, emparejado POR CONTENIDO usando el .docx como puente:
   video --(nombre de archivo)--> clip del doc --(texto del orden final)--> bloque del SRT */
function asignarPorBloques(){
  const bl = bloquesSRT(S.cues);
  S.clips.forEach(c=>{ c.subs=[]; c.bloque=-1; c.coinc=0; });
  S.bloques = bl.length;
  S.rangos = {};
  cruzarClips();

  const izq = S.clips.map(c => c.doc ? bolsa(textoDoc(c.doc)) : []);
  const der = bl.map(b => bolsa(b.map(q=>q.texto).join(' ')));
  let mapa = {};
  if(izq.some(x=>x.length)) mapa = emparejarVoraz(izq, der, dice, 0.25);

  const tomados = new Set(Object.keys(mapa).map(k=>mapa[k].j));
  const libres  = der.map((_,j)=>j).filter(j=>!tomados.has(j));
  S.clips.forEach((c,i)=>{
    let j = mapa[i] ? mapa[i].j : (libres.length ? libres.shift() : -1);
    if(j < 0) return;
    c.bloque = j;
    c.coinc  = mapa[i] ? mapa[i].s : 0;
    c.inicio = 0;
    c.subs = bl[j].map(q=>({ini:q.ini, fin:q.fin, texto:q.texto, partes:q.partes, marcadas:[]}));
  });
}
function textoDoc(d){
  return (d.orden && d.orden.length ? d.orden.join(' ') : (d.frases||[]).map(f=>f.texto).join(' '));
}
/* palabras del guion de ese clip, para el cotejo */
function bolsaDoc(c){
  if(!c.doc) return null;
  if(!c._bolsa) c._bolsa = new Set(bolsa(textoDoc(c.doc)));
  return c._bolsa;
}
function bloquesPorHueco(umbral){
  const bl=[]; let cur=[];
  for(let i=0;i<S.cues.length;i++){
    if(cur.length && S.cues[i].ini - S.cues[i-1].fin > umbral){ bl.push(cur); cur=[]; }
    cur.push(S.cues[i]);
  }
  if(cur.length) bl.push(cur);
  return bl;
}
function repartir(){
  S.clips.forEach(c=>{ c.subs=[]; c._bolsa=null; });
  if(!S.clips.length) return;
  const modo = S.modoReparto;

  if(modo==='guion'){ if(alinearConGuion()) return; asignarPorBloques(); return; }
  if(modo==='bloques'){ asignarPorBloques(); return; }

  if(modo==='acumulado'){
    let t=0; S.clips.forEach(c=>{ c.inicio=t; t+=c.dur; });
  }
  else if(modo==='huecos'){
    const bl = bloquesPorHueco(S.umbralHueco);
    S.clips.forEach((c,i)=>{ c.inicio = bl[i] ? bl[i][0].ini - 0.2 : (i?S.clips[i-1].inicio+S.clips[i-1].dur:0); });
  }
  else if(modo==='reinicio'){
    // los tiempos vuelven a 0 en cada clip: cortamos donde el tiempo retrocede
    const bl=[]; let cur=[];
    for(let i=0;i<S.cues.length;i++){
      if(cur.length && S.cues[i].ini < cur[cur.length-1].ini){ bl.push(cur); cur=[]; }
      cur.push(S.cues[i]);
    }
    if(cur.length) bl.push(cur);
    S.clips.forEach((c,i)=>{
      c.inicio = 0;
      c.subs = (bl[i]||[]).map(q=>({ini:q.ini,fin:q.fin,texto:q.texto,marcadas:[]}));
    });
    return;
  }
  // 'manual' respeta c.inicio tal cual está

  const tol = 0.08;
  S.clips.forEach(c=>{
    c.subs = S.cues
      .filter(q => q.ini >= c.inicio - tol && q.ini < c.inicio + c.dur - tol)
      .map(q => ({ini:+(q.ini-c.inicio).toFixed(3), fin:+(Math.min(q.fin, c.inicio+c.dur)-c.inicio).toFixed(3), texto:q.texto, marcadas:[]}));
  });
}
/* ============================ .DOCX EN EL NAVEGADOR ============================ */
/* Lee el ZIP a mano (EOCD → directorio central → cabecera local) y descomprime
   word/document.xml con DecompressionStream('deflate-raw'). Sin librerías. */
async function docxAParrafos(file){
  const buf = await file.arrayBuffer();
  const dv  = new DataView(buf);
  const u8  = new Uint8Array(buf);

  let eocd = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('no es un .docx válido');
  const nEntradas = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);

  let destino = null;
  for(let e = 0; e < nEntradas; e++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const metodo = dv.getUint16(p + 10, true);
    const compSz = dv.getUint32(p + 20, true);
    const nLen   = dv.getUint16(p + 28, true);
    const eLen   = dv.getUint16(p + 30, true);
    const cLen   = dv.getUint16(p + 32, true);
    const local  = dv.getUint32(p + 42, true);
    const nombre = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nLen));
    if(nombre === 'word/document.xml'){ destino = {metodo, compSz, local}; break; }
    p += 46 + nLen + eLen + cLen;
  }
  if(!destino) throw new Error('el .docx no trae word/document.xml');

  const nL = dv.getUint16(destino.local + 26, true);
  const eL = dv.getUint16(destino.local + 28, true);
  const ini = destino.local + 30 + nL + eL;
  const datos = u8.subarray(ini, ini + destino.compSz);

  let xml;
  if(destino.metodo === 0){
    xml = new TextDecoder().decode(datos);
  }else{
    if(typeof DecompressionStream === 'undefined')
      throw new Error('este navegador no sabe descomprimir .docx — usa Chrome o Safari 16.4+');
    const flujo = new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    xml = await new Response(flujo).text();
  }

  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  return [...doc.getElementsByTagName('w:p')].map(pn=>{
    let t = '';
    for(const nodo of pn.getElementsByTagName('*')){
      const n = nodo.tagName;
      if(n === 'w:t') t += nodo.textContent;
      else if(n === 'w:tab' || n === 'w:br' || n === 'w:cr') t += ' ';
    }
    return t.replace(/\s+/g,' ').trim();
  });
}

/* Doc ESENCIA: CLIP NN — Título · A) frases [mm:ss] · B) orden final · C) archivo.mp4 */
function parseDocEsencia(parras){
  const clips = [];
  let c = null, sec = '';
  const cerrar = ()=>{ if(c) clips.push(c); };
  for(const t of parras){
    if(!t) continue;
    const cab = t.match(/^CLIP\s+(\d+)\s*[—–-]\s*(.+)$/i);
    if(cab){ cerrar(); c = {num:cab[1], titulo:cab[2].trim(), frases:[], orden:[], archivo:'', desc:''}; sec=''; continue; }
    if(!c) continue;
    if(/^A\)/.test(t)){ sec='A'; continue; }
    if(/^B\)/.test(t)){ sec='B'; continue; }
    if(/^C\)/.test(t)){ sec='C'; continue; }
    if(/^D\)/.test(t)){ sec='D'; continue; }
    if(sec === 'A'){
      const f = t.match(/^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*(.+)$/);
      if(f) c.frases.push({tc:f[1], texto:f[2].replace(/\s*≈?\s*corte aprox\.?\s*$/i,'').trim()});
      else if(t.length > 30) c.frases.push({tc:'', texto:t});
    }
    else if(sec === 'B'){
      const o = t.match(/^(\d+)[.)]\s*(.+)$/);
      if(o) c.orden.push(o[2].trim());
      else if(t.length > 30) c.orden.push(t);
    }
    else if(sec === 'C'){ if(!c.archivo) c.archivo = t; }
    else if(sec === 'D'){ if(!c.desc) c.desc = t; }
  }
  cerrar();
  return clips.filter(x => x.orden.length || x.frases.length || x.archivo);
}

/* ---------- similitud por contenido ---------- */
function bolsa(t){
  return norm(String(t)).replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
}
function dice(a, b){
  const A = new Set(a), B = new Set(b);
  if(!A.size || !B.size) return 0;
  let i = 0; A.forEach(x=>{ if(B.has(x)) i++; });
  return 2*i / (A.size + B.size);
}
function normNombre(n){
  return norm(n).replace(/\.[a-z0-9]{2,4}$/,'').replace(/[^a-z0-9]+/g,' ').trim();
}

/* ---------- cortar el SRT concatenado en un bloque por clip ---------- */
function bloquesSRT(cues){
  const bl = []; let cur = [];
  for(const q of cues){
    const a = cur[cur.length-1];
    if(a && ((q.idx && a.idx && q.idx <= a.idx) || q.ini < a.ini - 0.001)){ bl.push(cur); cur = []; }
    cur.push(q);
  }
  if(cur.length) bl.push(cur);
  return bl;
}

/* ---------- emparejado que respeta el orden de las dos listas ----------
   Los clips salen de la secuencia en orden y los archivos vienen numerados en ese
   mismo orden, así que la asignación buena es monótona. Programación dinámica tipo
   alineamiento: permite saltarse elementos de cualquiera de los dos lados. */
function emparejarMonotono(izq, der, sim, minimo){
  const n = izq.length, m = der.length;
  if(!n || !m) return [];
  const dp = [], de = [];
  for(let i = 0; i <= n; i++){ dp.push(new Float64Array(m+1)); de.push(new Int8Array(m+1)); }
  const cache = [];
  for(let i = 0; i < n; i++){
    cache.push(new Float64Array(m));
    for(let j = 0; j < m; j++) cache[i][j] = sim(izq[i], der[j]);
  }
  for(let i = 1; i <= n; i++){
    for(let j = 1; j <= m; j++){
      const sc = cache[i-1][j-1];
      const diag = (sc >= minimo) ? dp[i-1][j-1] + sc : -Infinity;
      const arr = dp[i-1][j], iz = dp[i][j-1];
      if(diag >= arr && diag >= iz){ dp[i][j] = diag; de[i][j] = 0; }
      else if(arr >= iz){ dp[i][j] = arr; de[i][j] = 1; }
      else { dp[i][j] = iz; de[i][j] = 2; }
    }
  }
  const res = [];
  let i = n, j = m;
  while(i > 0 && j > 0){
    if(de[i][j] === 0){ res.push([i-1, j-1, cache[i-1][j-1]]); i--; j--; }
    else if(de[i][j] === 1) i--;
    else j--;
  }
  return res.reverse();
}

/* ---------- emparejado voraz y único ---------- */
function emparejarVoraz(izq, der, sim, umbral){
  const pares = [];
  for(let i = 0; i < izq.length; i++)
    for(let j = 0; j < der.length; j++)
      pares.push([i, j, sim(izq[i], der[j])]);
  pares.sort((a,b)=>b[2]-a[2]);
  const usI = new Set(), usJ = new Set(), res = {};
  for(const par of pares){
    if(par[2] < umbral) break;
    if(usI.has(par[0]) || usJ.has(par[1])) continue;
    usI.add(par[0]); usJ.add(par[1]); res[par[0]] = {j:par[1], s:par[2]};
  }
  return res;
}

/* ============================ CARGA DE ARCHIVOS ============================ */
function duracionDe(url){
  return new Promise(res=>{
    const v = document.createElement('video');
    v.preload='metadata'; v.muted=true;
    v.onloadedmetadata = ()=>res({dur:v.duration||0, w:v.videoWidth||0, h:v.videoHeight||0});
    v.onerror = ()=>res({dur:0,w:0,h:0});
    v.src = url;
  });
}
async function cargarArchivos(lista){
  const arch = [...lista];
  const vids = arch.filter(f=>/\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(f.name) || f.type.startsWith('video/'));
  const subs = arch.filter(f=>/\.(srt|vtt|txt)$/i.test(f.name));
  const jsons= arch.filter(f=>/\.json$/i.test(f.name));
  const docs = arch.filter(f=>/\.docx$/i.test(f.name));

  if(jsons.length){ await abrirAvanceArchivo(jsons[0]); return; }

  if(docs.length){
    try{
      const parras = await docxAParrafos(docs[0]);
      S.doc = parseDocEsencia(parras);
      S.docNombre = docs[0].name;
      if(!$('#fProyecto').value){
        $('#fProyecto').value = docs[0].name
          .replace(/\.docx$/i,'')
          .replace(/^ESENCIA[_\s-]*/i,'')
          .replace(/[_\s-]*(editor[_\s-]*)?aprobados$/i,'')
          .replace(/[_-]+/g,' ').trim()
          .replace(/\b\w/g, m=>m.toUpperCase()) || 'Proyecto';
      }
      if(!S.doc.length) toast('Ese .docx no tiene el formato CLIP NN — A) B) C)');
    }catch(err){ toast('No pude leer el .docx: ' + err.message); }
  }

  if(subs.length){
    const txt = await subs[0].text();
    S.cues = parseSubs(txt);
    S.srtNombre = subs[0].name;
    if(!S.cues.length) toast('Ese archivo de subtítulos no tenía bloques legibles');
  }
  let reenganchados = 0;
  if(vids.length){
    vids.sort((a,b)=>natSort(a.name,b.name));
    const nuevos=[];
    for(const f of vids){
      const url = URL.createObjectURL(f);
      const meta = await duracionDe(url);
      // si ese clip ya está en la sesión (recuperada o de un avance), solo le devolvemos el vídeo
      const ya = S.clips.find(c=>c.nombre===f.name);
      if(ya){
        if(ya.url) URL.revokeObjectURL(ya.url);
        ya.url = url;
        if(meta.dur){ ya.dur = meta.dur; ya.w = meta.w; ya.h = meta.h; }
        reenganchados++;
        continue;
      }
      nuevos.push({
        id:'c'+(S.contador++), nombre:f.name, url, dur:meta.dur, w:meta.w, h:meta.h,
        inicio:0, sync:0, bloque:-1, coinc:0, doc:null, docSim:0, comoCruzo:'', docManual:false,
        subs:[], errores:[], segsOk:[], revisado:false
      });
    }
    if(nuevos.length){
      S.clips = S.clips.concat(nuevos);
      S.clips.sort((a,b)=>natSort(a.nombre,b.nombre));
    }

  }
  const soloReenganche = reenganchados && !subs.length && !docs.length &&
                          S.clips.some(c=>c.subs.length);
  if(!soloReenganche){
    if(S.clips.length && S.cues.length){
      S.modoReparto = detectarModo();
      if($('#fModo')) $('#fModo').value = S.modoReparto;
    }
    repartir();
  }
  if(S.actual<0 && S.clips.length){
    const i = S.clips.findIndex(c=>c.url);
    if(i>=0) irAClip(i, 0);
  }
  pintarTodo();
  if(soloReenganche){
    const faltan = S.clips.filter(c=>!c.url).length;
    toast(`${reenganchados} vídeo(s) reenganchados` + (faltan?` · faltan ${faltan}`:' · sesión completa'));
  }else{
    const conDoc = S.clips.filter(c=>c.doc).length;
    const conSub = S.clips.filter(c=>c.subs.length).length;
    toast(`${S.clips.length} clip(s) · ${conSub} con subtítulos` + (S.doc.length?` · ${conDoc}/${S.clips.length} cruzados con el doc`:''));
  }
}

/* ============================ VIDEO ============================ */
const clipAct = () => S.clips[S.actual] || null;

function irAClip(i, t){
  if(i<0 || i>=S.clips.length) return;
  if(!S.clips[i].url){
    S.actual = i; pintarTodo();
    video.hidden = true; $('#sinVideo').style.display='';
    $('#sinVideo').innerHTML = `Falta el vídeo de <b>${esc(S.clips[i].nombre)}</b>.<br>Arrástralo y sigues donde lo dejaste.`;
    return;
  }
  const cambia = i !== S.actual;
  S.actual = i;
  const c = S.clips[i];
  if(cambia){
    video.hidden = false;
    $('#sinVideo').style.display='none';
    video.src = c.url;
    video.playbackRate = +$('#fVel').value;
    video.load();
  }
  if(t!=null){
    const ir = ()=>{ video.currentTime = Math.max(0, Math.min(t, (video.duration||c.dur)-0.001)); };
    if(video.readyState>=1) ir(); else video.addEventListener('loadedmetadata', ir, {once:true});
  }
  pintarTodo();
}
function paso(){
  const v = $('#fPaso').value;
  return v==='frame' ? 1/S.fps : +v;
}
function mover(d){
  if(!clipAct()) return;
  video.pause();
  video.currentTime = Math.max(0, Math.min((video.duration||0)-0.001, video.currentTime + d));
}
function subActual(){
  const c = clipAct(); if(!c) return null;
  const t = video.currentTime;
  return c.subs.find(s=>t>=sIni(c,s)-0.001 && t<=sFin(c,s)+0.001) || null;
}
function pintarOverlay(){
  const s = subActual();
  const o = $('#subOverlay');
  if(!s){ o.innerHTML=''; return; }
  const col = S.colorResalte || '#14a9ff';
  const cuerpo = (s.partes && s.partes.length)
    ? s.partes.map(x=> x.hl ? `<b style="color:${col};font-weight:600">${esc(x.t)}</b>` : esc(x.t)).join('')
    : esc(s.texto);
  o.innerHTML = '<span>'+cuerpo+'</span>';
}
function pintarTC(){
  const c = clipAct(); if(!c) return;
  const t = video.currentTime||0;
  $('#tcGrande').textContent = aTC(t);
  $('#tcSec').textContent = `${t.toFixed(3)} s` + (c.inicio>0.001?` · secuencia ${(c.inicio+t).toFixed(3)} s`:'') + (c.sync?` · sync ${c.sync>0?'+':''}${c.sync.toFixed(2)}`:'');

/* ============================ CINTA DE SEGUNDOS ============================ */
function nSegs(c){ return Math.max(1, Math.ceil((c.dur||0) - 0.15)); }
function pintarCinta(){
  const c = clipAct(); const cinta = $('#cinta');
  if(!c){ cinta.innerHTML=''; $('#pillCinta').textContent='—'; return; }
  const n = nSegs(c);
  const act = Math.floor(video.currentTime||0);
  const conErr = new Set(c.errores.map(e=>Math.floor(e.t)));
  let h='';
  for(let i=0;i<n;i++){
    const cls = ['seg', c.segsOk.includes(i)?'ok':'', conErr.has(i)?'err':'', i===act?'act':''].filter(Boolean).join(' ');
    h += `<div class="${cls}" data-s="${i}" title="segundo ${i}">${i}</div>`;
  }
  cinta.innerHTML=h;
  const marcados = c.segsOk.length;
  $('#pillCinta').textContent = `${marcados}/${n} s revisados`;
  const a = cinta.querySelector('.seg.act');
  if(a) a.scrollIntoView({block:'nearest'});
}
function marcarSegOk(){
  const c = clipAct(); if(!c) return;
  const s = Math.floor(video.currentTime||0);
  if(!c.segsOk.includes(s)) c.segsOk.push(s);
  const n = nSegs(c);
  if(s+1 < n) video.currentTime = s+1; else video.currentTime = Math.max(0,c.dur-0.05);
  if(c.segsOk.length >= n) c.revisado = true;
  pintarTodo();
}

/* ============================ CAPTURA DE FRAME ============================ */
function capturarFrame(maxW){
  maxW = maxW || 720;
  const c = clipAct();
  if(!c || !video.videoWidth) return null;
  const lienzo = $('#lienzo');
  const k = Math.min(1, maxW/video.videoWidth);
  lienzo.width  = Math.round(video.videoWidth*k);
  lienzo.height = Math.round(video.videoHeight*k);
  const ctx = lienzo.getContext('2d');
  ctx.drawImage(video, 0, 0, lienzo.width, lienzo.height);
  try{ return lienzo.toDataURL('image/jpeg', 0.82); }
  catch(e){ toast('No se pudo capturar el frame'); return null; }
}
function descargar(nombre, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function dataURLaBlob(d){
  const [cab, b64] = d.split(',');
  const mime = cab.match(/:(.*?);/)[1];
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return new Blob([u8], {type:mime});
}

function todosLosErrores(){

  S.clips.forEach((c,i)=>c.errores.forEach(e=>out.push({...e, clip:c, ci:i})));
  return out;
}
/* ---------- chequeo del resalte (regla ESENCIA: una palabra, sin abusar) ---------- */
function avisosResalte(c){
  const av = c.subs.map(()=>[]);
  let racha = 0;
  c.subs.forEach((s,i)=>{
    const r = resaltesDe(s);
    if(r.length){
      racha++;
      const pal = r.join(' ').trim().split(/\s+/).length;
      if(pal > 1) av[i].push(`resalte de ${pal} palabras`);
      if(r.length > 1) av[i].push('dos resaltes en la misma línea');
      if(racha >= 4) av[i].push(`${racha} líneas seguidas con resalte`);
    } else racha = 0;
  });
  return av;
}
function statsResalte(c){
  let con = 0, multi = 0, maxRacha = 0, racha = 0;
  c.subs.forEach(s=>{
    const r = resaltesDe(s);
    if(r.length){
      con++; racha++; maxRacha = Math.max(maxRacha, racha);
      if(r.join(' ').trim().split(/\s+/).length > 1) multi++;
    } else racha = 0;
  });
  return {con, multi, maxRacha, total:c.subs.length};
}

  const t = video.currentTime||0;

  let fuera = 0, total = 0;

  let filas = '';
  c.subs.forEach((s,i)=>{
    const act = t>=sIni(c,s)-0.001 && t<=sFin(c,s)+0.001;

      <button class="peq" id="bSyncTodos">a todos</button>
    </div>
    <div class="ayuda" style="margin-top:7px">
      ${bd ? 'Lo <span class="fuera">subrayado en rojo</span> no está en el guion aprobado. ' : ''}

    </div>

  v.innerHTML = cab + `<div class="ayuda" style="margin-bottom:9px">Clic en la línea para saltar ahí · clic en una <b>palabra</b> para reportarla · <b>empieza aquí</b> cuadra el sync.</div>` + filas;

/* ---------- autoguardado en el propio navegador (IndexedDB) ---------- */
const BD = {
  p:null,
  abrir(){
    if(this.p) return this.p;
    this.p = new Promise((res,rej)=>{
      const r = indexedDB.open('revisorQC', 1);
      r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains('sesion')) r.result.createObjectStore('sesion'); };
      r.onsuccess = ()=>res(r.result);
      r.onerror  = ()=>rej(r.error);
    });
    return this.p;
  },
  async op(modo, fn){
    try{
      const db = await this.abrir();
      return await new Promise((res,rej)=>{
        const t = db.transaction('sesion', modo);
        const pet = fn(t.objectStore('sesion'));
        t.oncomplete = ()=>res(pet ? pet.result : undefined);
        t.onerror = ()=>rej(t.error);
        t.onabort = ()=>rej(t.error);
      });
    }catch(e){ return undefined; }
  },
  set(v){ return this.op('readwrite', st=>st.put(v, 'actual')); },
  get(){ return this.op('readonly',  st=>st.get('actual')); },
  borrar(){ return this.op('readwrite', st=>st.delete('actual')); }
};

let _tGuardar = null, _guardando = false;

  if(!S.clips.length) return;
  clearTimeout(_tGuardar);

    _guardando = true;
    try{

    }catch(e){
      $('#guardado').textContent = 'no se pudo autoguardar';

function cargarAvance(d){
  S.proyecto=d.proyecto||''; S.cliente=d.cliente||''; S.revisor=d.revisor||'';
  S.fps=d.fps||30; S.modoReparto=d.modoReparto||'acumulado'; S.umbralHueco=d.umbralHueco||1.5;
  S.umbralGuion=d.umbralGuion||0.45; S.colorResalte=d.colorResalte||'#14a9ff';
  S.srtNombre=d.srtNombre||''; S.cues=d.cues||[];
  S.doc=d.doc||[]; S.docNombre=d.docNombre||''; S.bloques=d.bloques||0; S.rangos=d.rangos||{};
  $('#fProyecto').value=S.proyecto; $('#fCliente').value=S.cliente; $('#fRevisor').value=S.revisor;
  const previos = S.clips.slice();
  S.clips = (d.clips||[]).map(c=>{
    const match = previos.find(p=>p.nombre===c.nombre);
    return {id:'c'+(S.contador++), nombre:c.nombre, url:match?match.url:null, dur:c.dur, w:c.w, h:c.h,
            inicio:c.inicio, sync:c.sync||0, bloque:c.bloque!=null?c.bloque:-1, coinc:c.coinc||0,
            doc:S.doc.find(x=>x.num===c.docNum)||null, docSim:c.docSim||0,
            comoCruzo:c.comoCruzo||'', docManual:!!c.docManual, _bolsa:null,
            subs:c.subs||[], errores:c.errores||[], segsOk:c.segsOk||[], revisado:!!c.revisado};
  });
  S.actual = -1;
  if(S.clips.length){
    const conVideo = S.clips.findIndex(c=>c.url);
    irAClip(conVideo >= 0 ? conVideo : 0, 0);
  }
  pintarTodo();
  const faltan = S.clips.filter(c=>!c.url).length;
  toast(faltan? `Avance cargado · faltan ${faltan} video(s), arrástralos` : 'Avance cargado');
}

  const js = `
  var K='` + idInf + `';
  var st={};
  try{ st=JSON.parse(localStorage.getItem(K)||'{}'); }catch(e){ st={}; }
  function guardar(){ try{ localStorage.setItem(K,JSON.stringify(st)); }catch(e){} }
  function aviso(m){ var a=document.getElementById('aviso'); a.textContent=m; a.classList.add('on'); clearTimeout(a._t); a._t=setTimeout(function(){a.classList.remove('on');},1800); }
  function refrescar(){
    var arts=document.querySelectorAll('.err'), hechos=0;
    for(var i=0;i<arts.length;i++){
      var id=arts[i].getAttribute('data-id');
      var s=st[id]||{};
      arts[i].classList.toggle('resuelto', !!s.hecho);
      if(s.hecho) hechos++;
    }
    var tot=arts.length;
    document.getElementById('progBar').style.width = tot? (hechos/tot*100)+'%' : '0%';
    document.getElementById('progTxt').textContent = hechos+' de '+tot+' corregidos';
    filtrar();
  }
  var filtro='todos';
  function filtrar(){
    var arts=document.querySelectorAll('.err');
    for(var i=0;i<arts.length;i++){
      var h=arts[i].classList.contains('resuelto');
      arts[i].classList.toggle('oculto', (filtro==='pend'&&h)||(filtro==='hechos'&&!h));
    }
    var secs=document.querySelectorAll('section.clip');
    for(var j=0;j<secs.length;j++){
      var vis=secs[j].querySelectorAll('.err:not(.oculto)').length;
      var tiene=secs[j].querySelectorAll('.err').length;
      secs[j].style.display = (tiene&&!vis)?'none':'';
    }
  }
  document.addEventListener('change',function(ev){
    var t=ev.target;
    if(t.classList.contains('hecho')){
      var id=t.getAttribute('data-id'); st[id]=st[id]||{}; st[id].hecho=t.checked; guardar(); refrescar();
    }
  });
  document.addEventListener('input',function(ev){
    var t=ev.target;
    if(t.classList.contains('nota')){
      var id=t.getAttribute('data-id'); st[id]=st[id]||{}; st[id].nota=t.value; guardar();
    }
  });
  document.addEventListener('click',function(ev){
    var t=ev.target;
    if(t.classList.contains('copiar')){
      var tc=t.getAttribute('data-tc');
      if(navigator.clipboard) navigator.clipboard.writeText(tc);
      aviso('Timecode copiado: '+tc);
    }
    if(t.tagName==='IMG'&&t.closest('.izq')){
      document.getElementById('lupaImg').src=t.src; document.getElementById('lupa').classList.add('on');
    }
    if(t.id==='lupa'||t.id==='lupaImg'){ document.getElementById('lupa').classList.remove('on'); }
    if(t.hasAttribute('data-f')){
      filtro=t.getAttribute('data-f');
      var bs=document.querySelectorAll('[data-f]');
      for(var i=0;i<bs.length;i++) bs[i].classList.toggle('act', bs[i]===t);
      filtrar();
    }
    if(t.id==='bExport'){
      var META=JSON.parse(document.getElementById('META').textContent);
      for(var i=0;i<META.length;i++){ var s=st[META[i].id]||{}; META[i].corregido=!!s.hecho; META[i].nota=s.nota||''; }
      var b=new Blob([JSON.stringify({informe:K,fecha:new Date().toISOString(),items:META},null,2)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=K+'-estado.json';
      document.body.appendChild(a); a.click(); setTimeout(function(){a.remove();},1000);
      aviso('Estado exportado');
    }
    if(t.id==='bTodos'){
      var chs=document.querySelectorAll('.hecho');
      for(var i=0;i<chs.length;i++){ chs[i].checked=true; st[chs[i].getAttribute('data-id')]={hecho:true,nota:(st[chs[i].getAttribute('data-id')]||{}).nota||''}; }
      guardar(); refrescar(); aviso('Todo marcado como corregido');
    }
    if(t.id==='bReset'){
      st={}; guardar();
      var chs=document.querySelectorAll('.hecho'); for(var i=0;i<chs.length;i++) chs[i].checked=false;
      var ns=document.querySelectorAll('.nota'); for(var i=0;i<ns.length;i++) ns[i].value='';
      refrescar(); aviso('Estado reiniciado');
    }
  });
  (function(){
    var chs=document.querySelectorAll('.hecho');
    for(var i=0;i<chs.length;i++){ var s=st[chs[i].getAttribute('data-id')]; if(s&&s.hecho) chs[i].checked=true; }
    var ns=document.querySelectorAll('.nota');
    for(var i=0;i<ns.length;i++){ var s2=st[ns[i].getAttribute('data-id')]; if(s2&&s2.nota) ns[i].value=s2.nota; }
    refrescar();
  })();`;

}
function generarInforme(){
  if(!S.clips.length){ toast('No hay clips cargados'); return; }
  const {html, nombre} = construirInforme();
  descargar(nombre, new Blob([html], {type:'text/html;charset=utf-8'}));
  const mb = (new Blob([html]).size/1048576).toFixed(1);
  toast(`Informe generado (${mb} MB) → ${nombre}`);
}

$('#bCargar').onclick = ()=>$('#inArchivos').click();
$('#inArchivos').onchange = e=>{ if(e.target.files.length) cargarArchivos(e.target.files); e.target.value=''; };

$('#bGuardar').onclick = guardarAvance;

$('#bCaptura').onclick = ()=>{

  if(!d){ toast('No hay video'); return; }
  descargar(`captura_${(clipAct()||{}).nombre||'clip'}_${aTC(video.currentTime).replace(/:/g,'-')}.jpg`, dataURLaBlob(d));

$('#barra').onclick = e=>{
  const c = clipAct(); if(!c||!c.dur) return;
  const r = e.currentTarget.getBoundingClientRect();
  video.currentTime = Math.max(0, Math.min(c.dur-0.01, (e.clientX-r.left)/r.width*c.dur));
};
$('#cinta').onclick = e=>{
  const s = e.target.closest('.seg'); if(!s) return;
  video.currentTime = +s.dataset.s;
};
$('#velo').onclick = e=>{ if(e.target.id==='velo') cerrarModal(); };
$('#lupa').onclick = ()=>$('#lupa').classList.remove('act');

video.addEventListener('timeupdate', ()=>{ pintarTC(); pintarOverlay(); pintarCinta(); marcarSubActivo(); });
video.addEventListener('seeked',    ()=>{ pintarTC(); pintarOverlay(); pintarCinta(); marcarSubActivo(); });
video.addEventListener('play',  ()=>$('#bPlay').textContent='❚❚');
video.addEventListener('pause', ()=>$('#bPlay').textContent='▶');
video.addEventListener('loadedmetadata', ()=>{
  const c = clipAct();
  if(c && (!c.dur || Math.abs(c.dur-video.duration)>0.05) && isFinite(video.duration)){
    c.dur = video.duration; c.w=video.videoWidth; c.h=video.videoHeight;
    if(S.modoReparto!=='manual' && S.modoReparto!=='bloques') repartir();
  }
  pintarTodo();
});
function marcarSubActivo(){
  const c = clipAct(); if(!c) return;
  const t = video.currentTime;
  $$('#v-subs .sub').forEach(el=>{
    const s = c.subs[+el.dataset.i];
    el.classList.toggle('act', !!s && t>=sIni(c,s)-0.001 && t<=sFin(c,s)+0.001);
  });
  const a = $('#v-subs .sub.act');
  if(a && $('#v-subs').classList.contains('act')) a.scrollIntoView({block:'nearest'});
}

/* drag & drop */
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';}));
document.addEventListener('drop', e=>{
  e.preventDefault();
  if(e.dataTransfer.files.length) cargarArchivos(e.dataTransfer.files);
});

/* teclado */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ cerrarModal(); $('#lupa').classList.remove('act'); return; }
  const t = e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
  if($('#velo').classList.contains('act')) return;
  const k = e.key.toLowerCase();
  if(e.key===' '){ e.preventDefault(); if(clipAct()) video.paused?video.play():video.pause(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); mover(e.shiftKey?-5:-paso()); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); mover(e.shiftKey?5:paso()); }
  else if(k==='e'){ e.preventDefault(); nuevoError(); }
  else if(k==='g'){ e.preventDefault(); marcarSegOk(); }
  else if(k==='s'){ e.preventDefault(); $('#bCaptura').click(); }
  else if(k==='n'){ e.preventDefault(); if(S.actual<S.clips.length-1) irAClip(S.actual+1,0); }
  else if(k==='p'){ e.preventDefault(); if(S.actual>0) irAClip(S.actual-1,0); }
  else if(/^[1-9]$/.test(e.key)){ e.preventDefault(); const tp=TIPOS[+e.key-1]; if(tp) nuevoError({tipo:tp.id}); }
});

['fProyecto','fCliente','fRevisor'].forEach(id=>$('#'+id).addEventListener('input', leerCabecera));
